name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ssuksak.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ssuksak-apk
          path: ssuksak.apk

      # 폰 브라우저에서 바로 받을 수 있도록 Releases에도 올립니다.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ssuksak.apk --prerelease --target "$GITHUB_SHA" \
            --title "쓱싹 최신 빌드" --notes "ssuksak.apk를 받아 설치하세요."
