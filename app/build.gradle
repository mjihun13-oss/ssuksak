plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ssuksak.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ssuksak.app'
        minSdk 30          // Android 11+: 시스템 휴지통(createTrashRequest) 사용
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 외부 라이브러리 의존성 없음 (플랫폼 API만 사용)
